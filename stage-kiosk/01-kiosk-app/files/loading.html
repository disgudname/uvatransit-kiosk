<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Starting up</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #232d4b;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  /* The persistent shell: #content is the iframe every actual page (dashboard,
     fallback pages, whatever) loads into, #overlay is this splash sitting on
     top of it. Chromium itself only ever launches once, pointed at this page -
     see kiosk-launch.sh - so switching #overlay's opacity is the only visual
     transition that ever happens; there's no process relaunch to flash black
     or white. */
  #content {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    z-index: 1;
  }
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #232d4b;
    color: #f2f2f2;
    opacity: 1;
    transition: opacity 0.4s ease;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .card {
    text-align: center;
  }
  img.logo {
    width: 14vw;
    max-width: 220px;
    display: block;
    margin: 0 auto 2.5vw;
  }
  .bar-track {
    width: 22vw;
    max-width: 320px;
    height: 0.5vw;
    max-height: 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.18);
    overflow: hidden;
    margin: 0 auto;
  }
  .bar-fill {
    width: 40%;
    height: 100%;
    border-radius: 999px;
    background: #e57200;
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
  p {
    margin-top: 1.5vw;
    font-size: 1.2vw;
    color: #a9b2c3;
  }
</style>
</head>

    // first boot) - waits for the fade-in to actually finish so the swap
    // happens while the splash is fully opaque, not mid-fade.
    function cover(next) {
      overlay.classList.remove('hidden');
      var done = false;
      function proceed() {
        if (done) return;
        done = true;
        overlay.removeEventListener('transitionend', proceed);
        iframe.src = next;
      }
      overlay.addEventListener('transitionend', proceed);
      setTimeout(proceed, 500);
    }

    iframe.addEventListener('load', function () {
      if (pendingTarget === null) return;
      currentTarget = pendingTarget;
      pendingTarget = null;
      // Two rAFs so the new page gets a real frame painted before the
      // overlay starts fading, not just "load fired."
      requestAnimationFrame(function () {
        requestAnimationFrame(reveal);
      });
    });

    function applyTarget(target) {
      if (!target || target === currentTarget || target === pendingTarget) return;
      pendingTarget = target;
      if (currentTarget === null) {
        iframe.src = target;
      } else {
        cover(target);
      }
    }

    function poll() {
      fetch(STATUS_URL + '?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (data) { applyTarget(data.target); })
        .catch(function () {});
    }

    poll();
    setInterval(poll, POLL_MS);
  })();
  </script>
</body>
</html>
